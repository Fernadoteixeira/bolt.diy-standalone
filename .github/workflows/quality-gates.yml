# Quality Gates — CI pipeline for bolt.diy-standalone
#
# Runs a layered set of quality gates on every push to `main` and every PR
# targeting `main`. Fast, cheap gates (typecheck, lint, security) run first in
# parallel; heavier gates (tests, coverage, build) run in a second wave and are
# only executed when the cheap gates pass — this keeps CI minutes low when a
# PR fails an early check.
#
# Package manager: pnpm@9.14.4 (declared via `packageManager` in package.json).
# Node.js: 20.18.0 (matches .github/actions/setup-and-build defaults).
name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------- #
  # Wave 1 — fast gates (run in parallel)                                   #
  # --------------------------------------------------------------------- #

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.14.4'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache TypeScript build info
        uses: actions/cache@v4
        with:
          path: |
            .tsbuildinfo
            node_modules/.cache
          key: ${{ runner.os }}-tsc-${{ hashFiles('**/tsconfig.json', 'app/**/*.ts', 'app/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-tsc-

      # tsconfig.json already sets `noEmit: true`, so `tsc` == `tsc --noEmit`.
      - name: Run type check
        run: pnpm exec tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.14.4'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache ESLint
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/eslint
          key: ${{ runner.os }}-eslint-${{ hashFiles('eslint.config.*', 'app/**/*.ts', 'app/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-eslint-

      # The project's `lint` script targets `app/`. We add --max-warnings 0 so
      # the gate fails on any warning, not just errors.
      - name: Run ESLint (zero warnings/errors)
        run: pnpm run lint --max-warnings 0

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.14.4'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Local, dependency-free scan for hardcoded credentials and verifies the
      # RBAC/CSRF surface in app/lib/security.ts is intact.
      - name: Run security:check (hardcoded secrets + module integrity)
        run: pnpm run security:check

      # Known-vulnerability audit of the dependency tree. Fails on moderate+
      # advisories. (Deeper SAST/CodeQL + Trivy secret scanning already run in
      # .github/workflows/security.yaml — this is the fast dependency gate.)
      - name: Dependency vulnerability audit
        run: pnpm audit --audit-level moderate

  # --------------------------------------------------------------------- #
  # Wave 2 — heavier gates (only run when the fast gates pass)            #
  # --------------------------------------------------------------------- #

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [typecheck, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.14.4'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [typecheck, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.14.4'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs the full suite with coverage. Coverage thresholds are enforced by
      # vitest itself (see vitest.config.ts → coverage.thresholds). Vitest exits
      # non-zero if any threshold is missed, so this step is a hard gate.
      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            coverage/lcov.info
            coverage/coverage-summary.json
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [typecheck, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.14.4'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/
          retention-days: 3