services:
  postgres:
    build:
      context: .
      dockerfile: .docker/postgres/Dockerfile
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-bolt}
      - POSTGRES_USER=${POSTGRES_USER:-bolt}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-bolt}
    ports:
      - '127.0.0.1:${POSTGRES_PUBLIC_PORT:-5432}:5432'
    volumes:
      - bolt-postgres:/var/lib/postgresql
      - ./.docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  postgrest:
    image: postgrest/postgrest:latest
    environment:
      - PGRST_DB_URI=postgres://${POSTGRES_USER:-bolt}:${POSTGRES_PASSWORD:-bolt}@postgres:5432/${POSTGRES_DB:-bolt}
      - PGRST_DB_SCHEMA=bolt_ai
      - PGRST_DB_ANON_ROLE=bolt_anon
      - PGRST_SERVER_HOST=0.0.0.0
      - PGRST_SERVER_PORT=3000
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true

  app-prod:
    image: bolt-ai:production
    build:
      context: .
      dockerfile: Dockerfile
      target: bolt-ai-production
    ports:
      - '5173:5173'
    env_file:
      - path: '.env'
        required: false
      - path: '.env.local'
        required: false
    environment:
      - NODE_ENV=production
      - COMPOSE_PROFILES=production
      # No strictly needed but serving as hints for Coolify
      - PORT=5173
      # Alibaba DashScope (Qwen Models)
      - DASHSCOPE_API_KEY
      - DASHSCOPE_API_BASE_URL
      - OPENAI_LIKE_API_BASE_URL
      - OPENAI_LIKE_API_KEY
      # Other LLM Providers
      - GROQ_API_KEY
      - HuggingFace_API_KEY
      - OPENAI_API_KEY
      - OPENAI_API_BASE_URL
      - OPENAI_API_BASE_URLS
      - OPENAI_API_KEYS
      - ANTHROPIC_API_KEY
      - OPEN_ROUTER_API_KEY
      - GOOGLE_GENERATIVE_AI_API_KEY
      - OLLAMA_API_BASE_URL
      - XAI_API_KEY
      - TOGETHER_API_KEY
      - TOGETHER_API_BASE_URL
      - AWS_BEDROCK_CONFIG
      - VITE_LOG_LEVEL=${VITE_LOG_LEVEL:-debug}
      - DEFAULT_NUM_CTX=${DEFAULT_NUM_CTX:-32768}
      - RUNNING_IN_DOCKER=true
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-OpenAILike}
      - DEFAULT_LLM_MODEL=${DEFAULT_LLM_MODEL:-qwen-max}
      - DATABASE_URL=postgres://${POSTGRES_USER:-bolt}:${POSTGRES_PASSWORD:-bolt}@postgres:5432/${POSTGRES_DB:-bolt}
      - POSTGREST_URL=http://postgrest:3000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-bolt}
      - POSTGRES_USER=${POSTGRES_USER:-bolt}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-bolt}
      - POSTGRES_VECTOR_DIMENSIONS=${POSTGRES_VECTOR_DIMENSIONS:-256}
      - LOCAL_MAP_TILE_URL_TEMPLATE=/api/map/tiles/{z}/{x}/{y}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      # Persistent data volumes
      - bolt-data:/root/.config # Wrangler config and cache
      - bolt-cache:/app/.cache # Build cache
    command: pnpm run dockerstart
    profiles:
      - production
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      postgrest:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5173/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  app-dev:
    image: bolt-ai:development
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    env_file:
      - path: '.env'
        required: false
      - path: '.env.local'
        required: false
    environment:
      - NODE_ENV=development
      - VITE_HMR_PROTOCOL=ws
      - VITE_HMR_HOST=localhost
      - VITE_HMR_PORT=5173
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - PORT=5173
      # Alibaba DashScope (Qwen Models)
      - DASHSCOPE_API_KEY
      - DASHSCOPE_API_BASE_URL
      - OPENAI_LIKE_API_BASE_URL
      - OPENAI_LIKE_API_KEY
      # Other LLM Providers
      - GROQ_API_KEY
      - HuggingFace_API_KEY
      - OPENAI_API_KEY
      - OPENAI_API_BASE_URL
      - OPENAI_API_BASE_URLS
      - OPENAI_API_KEYS
      - ANTHROPIC_API_KEY
      - OPEN_ROUTER_API_KEY
      - XAI_API_KEY
      - GOOGLE_GENERATIVE_AI_API_KEY
      - OLLAMA_API_BASE_URL
      - TOGETHER_API_KEY
      - TOGETHER_API_BASE_URL
      - AWS_BEDROCK_CONFIG
      - VITE_LOG_LEVEL=${VITE_LOG_LEVEL:-debug}
      - DEFAULT_NUM_CTX=${DEFAULT_NUM_CTX:-32768}
      - RUNNING_IN_DOCKER=true
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-OpenAILike}
      - DEFAULT_LLM_MODEL=${DEFAULT_LLM_MODEL:-qwen-max}
      - DATABASE_URL=postgres://${POSTGRES_USER:-bolt}:${POSTGRES_PASSWORD:-bolt}@postgres:5432/${POSTGRES_DB:-bolt}
      - POSTGREST_URL=http://postgrest:3000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-bolt}
      - POSTGRES_USER=${POSTGRES_USER:-bolt}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-bolt}
      - POSTGRES_VECTOR_DIMENSIONS=${POSTGRES_VECTOR_DIMENSIONS:-256}
      - LOCAL_MAP_TILE_URL_TEMPLATE=/api/map/tiles/{z}/{x}/{y}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - type: bind
        source: .
        target: /app
        consistency: cached
      - type: volume
        source: bolt-node-modules
        target: /app/node_modules
        volume:
          nocopy: true
      - type: volume
        source: bolt-pnpm-store
        target: /pnpm/store
      - bolt-cache:/app/.cache
      - bolt-data:/root/.config
      - bolt-wrangler-state:/app/.wrangler
    ports:
      - '5173:5173'
    command: docker-dev-start
    profiles: ['development', 'default']
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      postgrest:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5173/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  app-prebuild:
    image: ghcr.io/stackblitz-labs/bolt.diy:latest
    ports:
      - '5173:5173'
    environment:
      - NODE_ENV=production
      - COMPOSE_PROFILES=production
      # No strictly needed but serving as hints for Coolify
      - PORT=5173
      # Alibaba DashScope (Qwen Models)
      - DASHSCOPE_API_KEY
      - DASHSCOPE_API_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
      - OPENAI_LIKE_API_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
      - OPENAI_LIKE_API_KEY
      # Local fallback options
      - OLLAMA_API_BASE_URL=http://127.0.0.1:11434
      - OPENAI_API_BASE_URLS=http://host.docker.internal:12434/v1
      - OPENAI_API_KEYS=local-openai-compatible
      - DEFAULT_NUM_CTX=${DEFAULT_NUM_CTX:-32768}
      - RUNNING_IN_DOCKER=true
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-OpenAILike}
      - DEFAULT_LLM_MODEL=${DEFAULT_LLM_MODEL:-qwen-max}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - bolt-data:/root/.config
      - bolt-cache:/app/.cache
    command: pnpm run dockerstart
    profiles:
      - prebuilt
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5173/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  bolt-postgres:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BOLT_POSTGRES_PATH:-./.docker/postgres/data}

  bolt-data:
    driver: local
  
  bolt-cache:
    driver: local
  
  bolt-node-modules:

  bolt-pnpm-store:

  bolt-wrangler-state:
