services:
  app-prod:
    image: bolt-ai:production
    build:
      context: .
      dockerfile: Dockerfile
      target: bolt-ai-production
    ports:
      - '5173:5173'
    env_file:
      - path: '.env'
        required: false
      - path: '.env.local'
        required: false
    environment:
      - NODE_ENV=production
      - COMPOSE_PROFILES=production
      # No strictly needed but serving as hints for Coolify
      - PORT=5173
      - GROQ_API_KEY
      - HuggingFace_API_KEY
      - OPENAI_API_KEY
      - ANTHROPIC_API_KEY
      - OPEN_ROUTER_API_KEY
      - GOOGLE_GENERATIVE_AI_API_KEY
      - OLLAMA_API_BASE_URL
      - XAI_API_KEY
      - TOGETHER_API_KEY
      - TOGETHER_API_BASE_URL
      - AWS_BEDROCK_CONFIG
      - VITE_LOG_LEVEL=${VITE_LOG_LEVEL:-debug}
      - DEFAULT_NUM_CTX=${DEFAULT_NUM_CTX:-32768}
      - RUNNING_IN_DOCKER=true
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      # Persistent data volumes
      - bolt-data:/root/.config # Wrangler config and cache
      - bolt-cache:/app/.cache # Build cache
    command: pnpm run dockerstart
    profiles:
      - production
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5173/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  app-dev:
    image: bolt-ai:development
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    env_file:
      - path: '.env'
        required: false
      - path: '.env.local'
        required: false
    environment:
      - NODE_ENV=development
      - VITE_HMR_PROTOCOL=ws
      - VITE_HMR_HOST=localhost
      - VITE_HMR_PORT=5173
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - PORT=5173
      - GROQ_API_KEY
      - HuggingFace_API_KEY
      - OPENAI_API_KEY
      - ANTHROPIC_API_KEY
      - OPEN_ROUTER_API_KEY
      - XAI_API_KEY
      - GOOGLE_GENERATIVE_AI_API_KEY
      - OLLAMA_API_BASE_URL
      - TOGETHER_API_KEY
      - TOGETHER_API_BASE_URL
      - AWS_BEDROCK_CONFIG
      - VITE_LOG_LEVEL=${VITE_LOG_LEVEL:-debug}
      - DEFAULT_NUM_CTX=${DEFAULT_NUM_CTX:-32768}
      - RUNNING_IN_DOCKER=true
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - type: bind
        source: .
        target: /app
        consistency: cached
      - type: volume
        source: bolt-node-modules
        target: /app/node_modules
        volume:
          nocopy: true
      - type: volume
        source: bolt-pnpm-store
        target: /pnpm/store
      - bolt-cache:/app/.cache
      - bolt-data:/root/.config
    ports:
      - '5173:5173'
    command: docker-dev-start
    profiles: ['development', 'default']
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5173/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  app-prebuild:
    image: ghcr.io/stackblitz-labs/bolt.diy:latest
    ports:
      - '5173:5173'
    environment:
      - NODE_ENV=production
      - COMPOSE_PROFILES=production
      # No strictly needed but serving as hints for Coolify
      - PORT=5173
      - OLLAMA_API_BASE_URL=http://127.0.0.1:11434
      - DEFAULT_NUM_CTX=${DEFAULT_NUM_CTX:-32768}
      - RUNNING_IN_DOCKER=true
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - bolt-data:/root/.config
      - bolt-cache:/app/.cache
    command: pnpm run dockerstart
    profiles:
      - prebuilt
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5173/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  bolt-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BOLT_DATA_PATH:-./.docker/data}
  
  bolt-cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BOLT_CACHE_PATH:-./.docker/cache}
  
  bolt-node-modules:

  bolt-pnpm-store:
